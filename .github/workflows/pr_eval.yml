name: Model Evaluation & Gating Pipeline

on:
  push:
    branches:
      - 'model/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  evaluate-and-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.2
        with:
          pixi-version: latest
          cache: true

      - name: Generate baseline model when needed
        run: |
          if [ -z "$(find models -maxdepth 1 -type f \( -name '*.pt' -o -name '*.pth' -o -name '*.bin' -o -name '*.keras' \) -print -quit)" ]; then
            pixi run python benchmark/train_dummy.py
          fi

      - name: Run model evaluation
        id: evaluation
        continue-on-error: true
        run: pixi run eval

      - name: Publish Telemetry to Main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Temporarily copy results.json outside the repo workspace
          cp data/results.json /tmp/results.json

          # Discard any local modifications so git checkout doesn't fail
          git checkout -- .
          git clean -fd

          # Fetch and switch to main
          git fetch origin main
          git checkout main
          git pull origin main

          # Restore index.html and the freshly evaluated results.json
          if [ -f "web/templates/index.html" ]; then
            cp web/templates/index.html ./index.html
          fi
          cp /tmp/results.json data/results.json

          git add data/results.json index.html
          git diff --cached --quiet || git commit -m "chore(telemetry): auto-update model evaluation results [skip ci]"
          git push origin main || echo "Telemetry push skipped"

      - name: Auto-Create Pull Request and Capture Number
        id: create-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUM=$(gh pr list --head "${{ github.ref_name }}" --json number --jq '.[0].number')
          
          if [ -z "$PR_NUM" ] || [ "$PR_NUM" = "null" ]; then
            PR_URL=$(gh pr create --title "feat(model): automated evaluation for ${{ github.ref_name }}" \
                                  --body "Automated MLOps pipeline triggered. Evaluation telemetry synchronized to GitHub Pages." \
                                  --base main \
                                  --head "${{ github.ref_name }}")
            # Extract the PR number from the returned GitHub URL or query list as fallback
            PR_NUM=$(echo "$PR_URL" | grep -oE '[0-9]+$' || gh pr list --head "${{ github.ref_name }}" --json number --jq '.[0].number')
          fi
          
          echo "PR_NUMBER=$PR_NUM" >> $GITHUB_OUTPUT
          echo "Active PR Number: $PR_NUM"

      - name: Handle Gating, Commenting, and Auto-Close / Auto-Merge
        id: gating
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.PR_NUMBER }}
          EVAL_OUTCOME: ${{ steps.evaluation.outcome }}
        run: |
          python - <<'PY' > /tmp/eval-summary.md
          import json
          try:
              with open("data/results.json", "r") as f:
                  data = json.load(f)
              status = data.get("status", "FAILED")
          except Exception:
              status = "FAILED"
              data = {"models": []}

          icon = "✅" if status == "PASSED" else "❌"
          print(f"## {icon} MLOps Gating Report: Status — **{status}**\n")
          print("| Model | Mean Latency | P95 Latency | Throughput | File Size | Parameters | Status |")
          print("|---|---:|---:|---:|---:|---:|---|")
          
          for model in data.get("models", []):
              val = model.get("validation", {})
              all_valid = all(val.values()) if val else False
              m_status = "PASSED" if all_valid else "FAILED"
              print(f"| `{model.get('model')}` | {model.get('mean_latency_ms', 'N/A')} ms | {model.get('p95_latency_ms', 'N/A')} ms | {model.get('throughput_fps', 'N/A')} FPS | {model.get('file_size_mb', 'N/A')} MB | {model.get('parameter_count', 'N/A')} | **{m_status}** |")
          PY

          gh pr comment "$PR_NUMBER" --body-file /tmp/eval-summary.md

          # Read status directly from the freshly generated results.json file
          PYTHON_STATUS=$(python -c 'import json; print(json.load(open("data/results.json"))["status"])')

          if [ "$PYTHON_STATUS" != "PASSED" ]; then
            echo "Evaluation failed threshold gates. Automatically closing PR."
            gh pr close "$PR_NUMBER" --comment "❌ MLOps Gate: One or more models failed performance thresholds. Automatically closing PR to protect production. Full telemetry is logged on the dashboard."
            exit 1
          else
            echo "Evaluation passed. Setting auto-merge."
            gh pr merge "$PR_NUMBER" --merge --auto || true
          fi

      - name: Delete Remote Feature Branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          echo "Cleaning up remote branch: $BRANCH_NAME"
          git push origin --delete "$BRANCH_NAME" || echo "Branch already deleted or cleaned up"