name: Model evaluation gate

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.2
        with:
          pixi-version: latest
          cache: true

      - name: Generate baseline model when needed
        run: |
          if [ -z "$(find models -maxdepth 1 -type f \( -name '*.pt' -o -name '*.pth' -o -name '*.bin' -o -name '*.keras' \) -print -quit)" ]; then
            pixi run python benchmark/train_dummy.py
          fi

      - name: Run model evaluation
        id: evaluation
        continue-on-error: true
        run: pixi run eval

      - name: Commit telemetry, update dashboard, and report status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVAL_OUTCOME: ${{ steps.evaluation.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Ensure root index.html is synced with the latest dashboard template
          if [ -f "web/templates/index.html" ]; then
            cp web/templates/index.html ./index.html
          fi
          
          # Stage and commit the generated results and dashboard
          git add data/results.json index.html
          git diff --cached --quiet || git commit -m "chore: auto-update model evaluation telemetry report"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}" || true

          # Generate markdown summary table for the PR comment
          python - <<'PY' > /tmp/eval-summary.md
          import json
          try:
              with open("data/results.json", "r") as f:
                  data = json.load(f)
              status = data.get("status", "FAILED")
          except Exception:
              status = "FAILED"
              data = {"models": []}

          icon = "✅" if status == "PASSED" else "❌"
          print(f"## {icon} MLOps Gating Report: Status — **{status}**\n")
          print("| Model | Mean Latency | P95 Latency | Throughput | File Size | Parameters | Status |")
          print("|---|---:|---:|---:|---:|---:|---|")
          
          for model in data.get("models", []):
              val = model.get("validation", {})
              all_valid = all(val.values()) if val else False
              m_status = "PASSED" if all_valid else "FAILED"
              print(f"| `{model.get('model')}` | {model.get('mean_latency_ms', 'N/A')} ms | {model.get('p95_latency_ms', 'N/A')} ms | {model.get('throughput_fps', 'N/A')} FPS | {model.get('file_size_mb', 'N/A')} MB | {model.get('parameter_count', 'N/A')} | **{m_status}** |")
          
          print("\n*Automated performance benchmark verified via GitHub Actions.*")
          PY

          # Post the summary table to the Pull Request
          gh pr comment "$PR_NUMBER" --body-file /tmp/eval-summary.md || echo "Failed to post PR comment"

          # Enforce the gating check: fail workflow if evaluation outcome failed
          if [ "$EVAL_OUTCOME" != "success" ]; then
            echo "Error: Model evaluation failed threshold gates."
            exit 1
          fi

          # Auto-merge if evaluation passed successfully
          gh pr merge "$PR_NUMBER" --merge --auto || echo "Auto-merge configuration skipped"