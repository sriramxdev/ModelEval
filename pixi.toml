[workspace]
name = "model-eval-cicd"
channels = ["conda-forge", "pytorch"]
platforms = ["linux-64", "win-64"]

[dependencies]
python = ">=3.11,<3.14"
pytorch = "*"
torchvision = "*"
psutil = "*"
numpy = "*"
fastapi = "*"
uvicorn = "*"
jinja2 = "*"

[pypi-dependencies]
tensorflow = ">=2.15.0"

[tasks]
eval = { cmd = "python benchmark/evaluate.py", description = "Benchmark all models and write telemetry" }
web = { cmd = "uvicorn web.app:app --host 0.0.0.0 --port 8000 --reload", description = "Run the telemetry dashboard" }